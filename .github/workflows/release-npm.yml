# Release for npm packages.
#
# Stages a publish, with npm trusted publishing (OIDC), when package.json's
# version has no "v<version>" tag yet. No npm token.
#
# A staged publish is not live. The owner approves it by hand, from their own
# machine, with `npm stage approve <stage-id>`. 2FA always applies to that
# step; no CI identity can do it. Find the stage ID with
# `npm stage list <package-name>` if it is not in this job's log.
#
# The owner creates the "v<version>" tag and the GitHub release after they
# approve the staged publish. This workflow does not do that for you,
# because the package is not live until the owner approves it.
#
# The package must have a Trusted Publisher set on npmjs.com for this exact
# repository and workflow file before its first automated release.
# "npm stage publish" is always allowed, so this needs no extra setting.
# See stacks/node-package/RULES.md for the one-time setup.
name: Release NPM Package

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "24"
      test_command:
        type: string
        default: npm test

permissions:
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version exists. Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Run tests
        if: steps.version.outputs.release == 'true'
        run: ${{ inputs.test_command }}

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: npm run build --if-present

      - name: Update npm
        if: steps.version.outputs.release == 'true'
        run: npm install -g npm@latest

      - name: Stage the publish
        if: steps.version.outputs.release == 'true'
        run: npm stage publish

      - name: Tell the owner to approve the staged publish
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## v$VERSION is staged, not live"
            echo
            echo "Approve it by hand, from your own machine. 2FA always applies."
            echo
            echo '```'
            echo "npm stage list $(node -p "require('./package.json').name")"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "After it is approved, create the \"v$VERSION\" tag and the GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"
