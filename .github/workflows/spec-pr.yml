# Spec pull request.
#
# Runs on a push to a "spec/*" branch. Opens a pull request as
# github-actions[bot], so the owner is not the author and can approve it.
# Then it requests the owner's review.
name: Spec PR

on:
  workflow_call:

jobs:
  open:
    if: startsWith(github.ref_name, 'spec/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
      BASE: ${{ github.event.repository.default_branch }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open the pull request
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is open. Nothing to do."
            exit 0
          fi
          spec="$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" -- 'specs/[0-9]*.md' | head -n 1)"
          if [ -z "$spec" ]; then
            echo "No spec file changed on $BRANCH."
            exit 1
          fi
          title="$(sed -n 's/^# //p' "$spec" | head -n 1)"
          release="$(sed -n 's/^- \*\*Release:\*\* *//p' "$spec" | head -n 1)"
          tick='`'
          body="$(printf 'Adds %s.\n\n- **Release:** %s\n\nMerge this pull request to start the build agent.\n' "$tick$spec$tick" "$release")"
          gh pr create --base "$BASE" --head "$BRANCH" --title "Spec: ${title:-$spec}" --body "$body"
          gh pr edit "$BRANCH" --add-reviewer "$OWNER"
