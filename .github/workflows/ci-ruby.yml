# CI for Ruby projects: runs RSpec on each Ruby version.
name: CI Ruby

on:
  workflow_call:
    inputs:
      ruby_versions:
        description: "JSON list of Ruby versions."
        type: string
        default: '["2.7", "3.0", "3.1", "3.2", "3.3"]'
      test_command:
        type: string
        default: bundle exec rspec

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ${{ fromJSON(inputs.ruby_versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: ${{ inputs.test_command }}
