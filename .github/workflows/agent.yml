# Agent router.
#
# Projects call only this workflow, from one caller file (skeleton/.github/workflows/agent.yml).
# The caller has all triggers and permissions, so changes here need no caller change.
#
# Events:
# - push to "build/*" by a person: find the new spec and start the build with workflow_dispatch.
#   The Claude action does not support push events.
# - issues labeled "ready": create a "build/issue-<number>" branch and start the build the
#   same way, with the issue number instead of a spec file. Only a caller that adds the
#   "issues" trigger sends this event; a caller without it (the skeleton default) never does.
# - workflow_dispatch with a spec or an issue: run the build agent on the current branch.
# - pull_request opened or changed: run the review agent.
# - pull_request labeled: run the fix agent (when the label is "changes-requested")
#   or the merge agent (when the label is "review-passed").
name: Agent

on:
  workflow_call:
    inputs:
      spec:
        description: "Spec file to build. Set only on workflow_dispatch."
        type: string
        default: ""
      issue:
        description: "Issue number to build. Set only on workflow_dispatch."
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  start-build:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'build/') &&
      !startsWith(github.ref_name, 'build/issue-') &&
      github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
      BASE: ${{ github.event.repository.default_branch }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start the build for the new spec
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is open. The review handles new pushes."
            exit 0
          fi
          specs="$(git diff --name-only --diff-filter=A "origin/$BASE...HEAD" -- 'specs/[0-9]*.md')"
          count="$(printf '%s' "$specs" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "The branch must add exactly one spec file. It adds $count:"
            printf '%s\n' "$specs"
            exit 1
          fi
          # WORKFLOW_REF is "owner/repo/.github/workflows/<file>@<ref>".
          caller="$(basename "${WORKFLOW_REF%@*}")"
          echo "Starting the build for $specs on $BRANCH"
          gh workflow run "$caller" --ref "$BRANCH" -f spec="$specs"

  start-build-from-issue:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Start the build for the issue
        run: |
          branch="build/issue-$ISSUE"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is open. The review handles new pushes."
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git checkout -b "$branch"
            git push origin "$branch"
          fi
          # WORKFLOW_REF is "owner/repo/.github/workflows/<file>@<ref>".
          caller="$(basename "${WORKFLOW_REF%@*}")"
          echo "Starting the build for issue #$ISSUE on $branch"
          gh workflow run "$caller" --ref "$branch" -f issue="$ISSUE"

  build:
    if: github.event_name == 'workflow_dispatch' && (inputs.spec != '' || inputs.issue != '')
    uses: leanucci/workflows/.github/workflows/build.yml@v1
    with:
      spec: ${{ inputs.spec }}
      issue: ${{ inputs.issue }}
    secrets: inherit

  review:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    uses: leanucci/workflows/.github/workflows/review.yml@v1
    secrets: inherit

  fix:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled'
    uses: leanucci/workflows/.github/workflows/fix.yml@v1
    secrets: inherit

  merge:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled'
    uses: leanucci/workflows/.github/workflows/merge.yml@v1
