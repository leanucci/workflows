# Merge agent.
#
# Runs when a build pull request gets the "review-passed" label.
# Merges the pull request, unless the "needs-human" label is set or the
# spec asks for human approval. The build agent already added the
# JOURNAL.md entry, so this workflow only checks and merges.
name: Merge

on:
  workflow_call: {}

jobs:
  merge:
    if: >-
      github.event.label.name == 'review-passed' &&
      startsWith(github.event.pull_request.head.ref, 'build/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Find the spec
        id: spec
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "body<<__SPEC_BODY_EOF__" >> "$GITHUB_OUTPUT"
          case "$BRANCH" in
            build/issue-*)
              issue="${BRANCH#build/issue-}"
              gh issue view "$issue" --json body --jq .body >> "$GITHUB_OUTPUT"
              ;;
            *)
              spec="specs/${BRANCH#build/}.md"
              test -f "$spec" || { echo "No spec file at $spec for branch $BRANCH."; exit 1; }
              cat "$spec" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "__SPEC_BODY_EOF__" >> "$GITHUB_OUTPUT"

      - name: Check for a block on auto-merge
        id: block
        env:
          SPEC_BODY: ${{ steps.spec.outputs.body }}
        run: |
          labels="$(gh pr view "$PR" --json labels --jq '.labels[].name')"
          reason=""
          if echo "$labels" | grep -qx needs-human; then
            reason="The review agent, or an earlier step, added the needs-human label."
          elif printf '%s' "$SPEC_BODY" | grep -qiE '^\s*-\s*\*\*Human approval:\*\*\s*required'; then
            reason="The spec sets Human approval: required."
          fi
          if [ -n "$reason" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask the owner when auto-merge is blocked
        if: steps.block.outputs.blocked == 'true'
        run: |
          gh pr edit "$PR" --add-reviewer "$OWNER"
          gh pr comment "$PR" --body "Review passed, but this pull request needs your approval before merge. ${{ steps.block.outputs.reason }}"

      # GitHub refuses to let the default token approve a pull request, on every repo this
      # project has checked. The review agent's own approval (prompts/review-claude.md, with
      # its own pinned identity) already satisfies the required review count, so this step
      # only merges.
      - name: Merge
        if: steps.block.outputs.blocked == 'false'
        run: gh pr merge "$PR" --auto --squash --delete-branch
