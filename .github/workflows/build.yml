# Build agent.
#
# Runs the build agent on one spec, on the current "build/*" branch.
# The branch already contains the spec file, or is empty and the task names an issue instead.
# The agent adds the code, pushes, and opens one pull request with the spec and the code.
# agent.yml calls this workflow on a workflow_dispatch event.
name: Build

on:
  workflow_call:
    inputs:
      spec:
        description: "Spec file to build, for example specs/002-name.md."
        type: string
        default: ""
      issue:
        description: "Issue number to build, instead of a spec file."
        type: string
        default: ""
      model:
        type: string
        default: claude-opus-5-5
      max_turns:
        type: number
        default: 150
      kit_repo:
        type: string
        default: leanucci/workflows
      kit_ref:
        type: string
        default: v1
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  build:
    if: startsWith(github.ref_name, 'build/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: build-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the spec
        env:
          SPEC: ${{ inputs.spec }}
          ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$SPEC" ]; then
            case "$SPEC" in
              specs/[0-9]*.md) ;;
              *) echo "Spec path must match specs/NNN-name.md: $SPEC"; exit 1 ;;
            esac
            test -f "$SPEC" || { echo "Spec file not found: $SPEC"; exit 1; }
          elif [ -n "$ISSUE" ]; then
            state="$(gh issue view "$ISSUE" --json state --jq .state)"
            [ "$state" = "OPEN" ] || { echo "Issue #$ISSUE is not open."; exit 1; }
          else
            echo "Neither a spec file nor an issue was given."
            exit 1
          fi

      - name: Load prompts
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() { gh api "repos/${{ inputs.kit_repo }}/contents/prompts/$1?ref=${{ inputs.kit_ref }}" -H "Accept: application/vnd.github.raw"; }
          {
            echo 'text<<__PROMPT_EOF__'
            fetch common.md
            echo
            fetch build.md
            echo
            echo '__PROMPT_EOF__'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # agent.yml starts this run with GITHUB_TOKEN.
          allowed_bots: github-actions
          prompt: |
            ${{ steps.prompt.outputs.text }}

            ## Task Input

            - Repository: ${{ github.repository }}
            - Base branch: ${{ github.event.repository.default_branch }}
            - Branch: ${{ github.ref_name }}
            - ${{ inputs.spec != '' && format('Spec file: {0}', inputs.spec) || format('Spec issue: #{0}', inputs.issue) }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep
