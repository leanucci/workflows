# Release for Go packages.
#
# Go has no publish step: proxy.golang.org discovers a version from its git tag the first
# time anything fetches it. This workflow only creates and pushes the "v<version>" tag, and
# a GitHub release, once the VERSION file has no tag yet.
name: Release Go Package

on:
  workflow_call:
    inputs:
      go_version:
        type: string
        default: "1.25"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Check the version
        id: version
        run: |
          if [ -z "$(find . -name '*.go' -print -quit)" ]; then
            echo "No .go files. Nothing to release yet."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version exists. Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: go test ./...

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: go build ./...

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
